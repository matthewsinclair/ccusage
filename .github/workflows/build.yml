name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add "${{ matrix.target }}"
      - name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "Tag $REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - name: Release helper integration tests
        run: sh tests/release.sh
      - name: Signing pipeline regression tests
        run: python3 -m unittest discover -s tests -p 'signing_test.py'
      - run: cargo clippy --all-targets --locked --target "${{ matrix.target }}" -- -D warnings
      - run: cargo test --locked --target "${{ matrix.target }}"
      - name: Native Keychain renewal storage test
        if: runner.os == 'macOS'
        run: cargo test --locked --target "${{ matrix.target }}" native_keychain_updates_existing_item_without_plaintext_fallback -- --ignored
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p staging dist
          cp "target/$TARGET/release/ccusage" LICENSE README.md design/icons/ccusage-logo.svg staging/
          tar -czf "dist/ccusage-v${VERSION}-${TARGET}.tar.gz" -C staging .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccusage-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ccusage-*
          path: dist
          merge-multiple: true
      - name: Checksums and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum ccusage-*.tar.gz > SHA256SUMS
          gh release create "$TAG" ccusage-*.tar.gz SHA256SUMS \
            --draft --verify-tag --generate-notes --title "Ccusage $TAG"
