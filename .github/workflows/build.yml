name: Build and release

on:
  push:
    # candidate/<tag> is where bin/devbin release asks CI before it tags
    branches: [main, "candidate/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The release's targets, here alone: bin/devbin macos finalize reads them from
        # this block, and tests/macos.bats holds the formula's Mac archives to them
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add "${{ matrix.target }}"
      - name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ccusage") | .version')
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "Tag $REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked --target "${{ matrix.target }}" -- -D warnings
      - run: cargo test --locked --no-fail-fast --target "${{ matrix.target }}"
      # Each ignored keychain test is named *_readable_by_security, the filter
      # bin/.devbin/config.yaml's keychain test uses too.
      - name: Native Keychain storage tests
        if: runner.os == 'macOS'
        run: cargo test --locked --no-fail-fast --target "${{ matrix.target }}" readable_by_security -- --ignored
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package executable
        env:
          TARGET: ${{ matrix.target }}
          # macOS tar would add a ._ entry for each file with extended attributes,
          # which bin/devbin macos finalize refuses; GNU tar ignores this.
          COPYFILE_DISABLE: "1"
        run: |
          # Rooted at the install root, as devbin's formula lays the archive out in the
          # keg: bin/ccusage alone, the tree bin/.devbin/config.yaml's install: block
          # declares, and the one member bin/devbin macos finalize unpacks
          mkdir -p staging/bin dist
          cp "target/$TARGET/release/ccusage" staging/bin/
          tar -czf "dist/ccusage-v${VERSION}-${TARGET}.tar.gz" -C staging .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccusage-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ccusage-*
          path: dist
          merge-multiple: true
      - name: Checksums and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          # SHA256SUMS.ci, not SHA256SUMS: bin/devbin formula reads SHA256SUMS, which
          # only bin/devbin macos finalize writes, once the Mac archives are signed.
          sha256sum ccusage-*.tar.gz > SHA256SUMS.ci
          gh release create "$TAG" ccusage-*.tar.gz SHA256SUMS.ci \
            --draft --verify-tag --generate-notes --title "Ccusage $TAG"
