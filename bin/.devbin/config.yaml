# ccusage -- devbin configuration.
#
# Written by: devbin install. Every key, annotated, is vendored beside this
# file at bin/.devbin/lib/config.reference.yaml.

project:
  name: ccusage
  languages:
    - rust
    - shell
  # Cargo.toml's [package] version is the project's. bin/devbin release is the
  # one step that changes it, its derived: lock-sync bringing Cargo.lock along;
  # `bin/devbin version set`, `bump` and `sync` would write Cargo.toml alone, so
  # usage-rules.md rules them out.
  version_from: Cargo.toml

# The devbin this project expects. Enforced by: devbin doctor. 0.1.23 carries all
# of devbin#0326, which install:, the version line and the formula's one install
# body below rest on.
devbin_version: "^0.1.23"

# Ccusage's own tool, under devbin's dev/opt/brew contract (docs/dev-opt-brew.md in
# devbin's repository; ISSUE:0007). In this checkout bin/devbin install publishes it
# to the opt prefix, and bin/devbin use [dev|opt|brew] points its link in
# ~/.local/bin; ccusage itself has no install, use or version verb for them. Each
# tree holds bin/ccusage alone, as each release archive does, and the manifest
# .ccusage-install, whose line an opt or brew ccusage prints for --version. No
# LICENSE or README joins it: after a formula's install Homebrew moves such files out
# of libexec when the keg's root has none, as a keg laid out from an archive has, and
# the manifest would then name files the keg does not hold.
install:
  prefix: ~/Devel/opt/ccusage
  links:
    ccusage: target/release/ccusage

# This file is the one home of Ccusage's checks and release; README,
# docs/releasing.md and usage-rules.md say to run them through bin/devbin. Every
# cargo line takes --locked, so a check never rewrites Cargo.lock, and every
# cargo test takes --no-fail-fast, so one failing target never hides another.
# The project commands, macos, post-cut, lock-sync and nopython, are in
# bin/.devbin/cmd/, and the zsh the first three share is in
# bin/.devbin/cmd/common/.
commands:
  build:
    run: cargo build --release --locked
  check:
    options:
      clippy:
        run: cargo clippy --all-targets --locked -- -D warnings
      actionlint:
        summary: The build and release workflow
        run: actionlint .github/workflows/build.yml
        log: true
      shellcheck:
        summary: The bats suites
        run: shellcheck tests/*.bats
        log: true
      nopython:
        summary: No Python in what the repository tracks (ISSUE:0004)
        run: bin/.devbin/cmd/nopython
        grammar: generic
        log: NOPYTHON
  test:
    options:
      rust:
        run: cargo test --locked --no-fail-fast
      # The shell slot is devbin's own, bats tests: the macos, post-cut and
      # lock-sync project commands, the library they share and the nopython
      # check. The signer is the maintainer's Mac's alone, and its suite leans
      # on macOS's bsdtar, stat and csreq.
      shell:
        summary: The bats suites for the project commands
        platforms:
          - macos
      # The ignored keychain tests need the macOS Security service, and each
      # makes its own disposable keychain under ~/Library/Keychains. Each is
      # named *_readable_by_security, which is the filter, so a new one joins
      # this run, and CI's macOS step, by its name.
      keychain:
        summary: Keychain writes against a disposable keychain
        run: cargo test --locked --no-fail-fast readable_by_security -- --ignored
        grammar: cargo
        log: true
        platforms:
          - macos
  release:
    enabled: true
  formula:
    enabled: true

# The cut: the version stamped into Cargo.toml and Cargo.lock, the CHANGELOG note
# dated, the gates and CI on candidate/<tag> green, then the tag and the push.
# CI's tag run makes the release object, a draft holding the four archives and
# SHA256SUMS.ci, which object: ci waits for. Then, under the cut's one yes, its
# one after: line, bin/devbin post-cut: bin/devbin macos finalize <tag> signs and
# notarizes the Mac archives and publishes the draft, then bin/devbin formula
# publish brings the tap to it. One line, because the core runs every after: line
# even when one before it failed, and formula publish needs the signed release.
# bin/devbin post-cut <tag> resumes a release that stopped after its tag.
release:
  repo: matthewsinclair/ccusage
  remotes:
    - local
    - upstream
  branch: main
  notes:
    kind: changelog
  derived:
    - bin/devbin lock-sync
  gates:
    - check all
    - test all
    - build
    - doctor
  ci:
    workflow: build.yml
  object: ci
  object_wait: 40m
  after:
    - bin/devbin post-cut

# The Homebrew formula, from the template packaging/homebrew/ccusage.rb. On macOS it
# lays the signed Mac archive out in the keg, and on Linux it publishes from the
# tag's checkout with bin/devbin install, so both kegs hold the tree install:
# declares. The tap is named because its remote goes through hv's ssh host alias.
formula:
  mode: assets
  tap: git@github.com-matthewsinclair:matthewsinclair/homebrew-ccusage.git
  # The Mac archives, as CI names them for the build matrix's Mac targets, which
  # are the targets' one home; tests/macos.bats fails when the two differ
  assets:
    - "ccusage-v{version}-aarch64-apple-darwin.tar.gz"
    - "ccusage-v{version}-x86_64-apple-darwin.tar.gz"

# What the build reads beyond the sources cargo's dep-info names, so the line
# bin/devbin build stamps carries +dirty for a changed manifest or lock file too
# (T4). It declares no artefact, so nothing is cached.
build:
  inputs:
    - Cargo.toml
    - Cargo.lock
    - src
