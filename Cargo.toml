[package]
name = "ccusage"
version = "0.1.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/matthewsinclair/ccusage"
description = "Named Claude Code accounts and a compact terminal usage dashboard"

[dependencies]
# Native credential files, usage responses, and persisted state.
serde = { version = "1", features = ["derive"] }
# A shared-mode switch rewrites Claude's .claude.json, so its keys keep their order and
# its floats are parsed exactly, each written back bit for bit.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# Human-editable profile configuration.
toml = "0.9"
# Blocking HTTPS; no async runtime or model SDK.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Keyboard events, terminal sizing, colors, and safe raw-mode handling.
crossterm = "0.29"
# ISO-8601 reset times from the usage API.
time = { version = "0.3", features = ["parsing", "formatting"] }
# Claude's per-directory macOS Keychain service names and usage-cache credential IDs.
sha2 = "0.10"

# Claude Code hashes the NFC form of a config directory for its Keychain service names.
[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1"

# The disposable-keychain test only; ccusage reaches Keychain through /usr/bin/security.
[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = "line-tables-only"
